services:
  db:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:55438:5432"
    environment:
      POSTGRES_DB: peppy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - peptide-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d peppy"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  peptide-data:
